# Alembic config for the RankForge backend.
#
# Migrations live in db/migrations/versions/. The DB URL is set
# programmatically by db/migrations/env.py from settings.DATABASE_URL,
# so do NOT set sqlalchemy.url here.
#
# Run from the backend/ directory:
#   alembic upgrade head           # apply pending migrations
#   alembic current                # show current revision
#   alembic history                # list migrations
#   alembic revision -m "msg"      # create a new migration
#
# Most users don't need to call alembic directly — db/init_db.py wraps
# the common operations and the FastAPI lifespan calls it on startup.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
