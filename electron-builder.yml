appId: com.rankforge.app
productName: RankForge
directories:
  buildResources: resources
  output: dist

# Negative-only patterns merge with electron-builder's default `**/*` and
# its smart node_modules handling (production deps only). The previous
# `!node_modules/**/*` blanket-excluded all node_modules, which caused
# electron-updater (a runtime require from main) to be missing in the
# packaged app.
files:
  - "!**/.vscode/*"
  - "!src/**/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!**/{.eslintignore,.prettierignore,.prettierrc*,.eslintrc.cjs,.eslintrc.js,.editorconfig,tsconfig.json,tsconfig.*.json,*.tsbuildinfo}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock,package-lock.json}"
  - "!backend/**/*"
  - "!.venv/**/*"
  - "!docs/**/*"
  - "!resources/build_icon.py"
  - "!*.md"
  - "!CLAUDE.md"
  - "!.tmp-issues/**/*"

# Ship the PyInstaller-bundled backend instead of raw Python source —
# end users don't need Python installed. Build the bundle first with:
#   cd backend && python -m PyInstaller --clean --noconfirm build_pyinstaller.spec
extraResources:
  - from: backend/dist/rankforge_backend
    to: backend
    filter:
      - "**/*"
  - from: resources/icon.png
    to: icon.png

win:
  target: nsis
  icon: resources/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RankForge

mac:
  target: dmg

linux:
  target: AppImage

# Auto-update via GitHub Releases. The publish config tells
# electron-updater where to look for `latest.yml` (the manifest the
# packager uploads alongside the .exe). When the running app finds a
# newer version listed there, it downloads + installs.
publish:
  provider: github
  owner: AbhishekNaik1112
  repo: RankForge
